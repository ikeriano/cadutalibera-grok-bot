plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = new File('/workspace/ahoracaigo/rebuild/keystore/keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.ikeriano.webjuego'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ikeriano.cadutalibera.lite'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '1.0.3-lite'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile new File('/workspace/ahoracaigo/rebuild/keystore/' + ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    androidResources { noCompress += ['mp3','mp4','webp','png','onnx'] }
    lint { abortOnError false; checkReleaseBuilds false }
}
